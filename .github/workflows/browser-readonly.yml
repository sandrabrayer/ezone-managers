name: browser-readonly

on:
  pull_request:

jobs:
  chromium-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Install browser test dependency (CI only)
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Synthetic Managers browser smoke
        run: node test/browser-readonly.cjs
      - name: Save synthetic-only 390px screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managers-synthetic-chromium
          path: artifacts/managers-synthetic-390.png
          if-no-files-found: ignore
          retention-days: 7
