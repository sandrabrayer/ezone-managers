name: browser-worker-identity

on:
  pull_request:

jobs:
  chromium-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Install browser test dependency (CI only)
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Synthetic duplicate-name browser acceptance
        run: node e2e/worker-identity.cjs
      - name: Synthetic worker identity v2 browser acceptance (Dashboard #415)
        run: node e2e/worker-identity-v2.cjs
      - name: Save synthetic 390px screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managers-worker-identity-synthetic
          path: |
            artifacts/identity-synthetic-390.png
            artifacts/identity-v2-synthetic-390.png
          if-no-files-found: ignore
          retention-days: 7
